name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint source code
        run: pnpm lint

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Validate channel fixtures
        run: pnpm fixtures:validate

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions

      # Integration tests run dist entry points, so build the workspace in dependency order first
      - name: Build workspace
        run: pnpm build

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
