name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint source code
        run: pnpm lint

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Validate channel fixtures
        run: pnpm fixtures:validate

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions

      # 进程集成测试使用 dist 入口，必须先按依赖顺序构建
      - name: Build workspace
        run: pnpm build

      - name: Check types
        run: pnpm typecheck

      - name: Validate minimal configuration
        run: pnpm config:check

      - name: Check translation resources
        run: pnpm i18n:check

      - name: Run tests
        run: pnpm test

      # 工件链路使用真实本地容器，平台和模型边界继续用受控替身
      - name: Verify container isolation
        run: |
          docker pull python:3.13-slim
          pnpm container:smoke

      - name: Verify document artifact image
        run: |
          docker build -t synapse-artifacts:0.1 deploy/artifacts
          node tools/artifact-formats-smoke.mjs

      - name: Verify group artifact runtime with Docker
        env:
          SYNAPSE_TEST_DOCKER: "1"
        run: pnpm --filter @synapse/runtime-server exec vitest run src/server/runtime-artifacts.test.ts
